services:
  db:
    image: postgres:16-alpine
    container_name: roxiler-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roxiler_rating
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roxiler_rating"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
